services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      # O POSTGRES_USER é o dono do banco: roda as migrações (serviço migrate).
      POSTGRES_USER: ${DB_OWNER_USER:-medialist_owner}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:-medialist-owner-dev}
      POSTGRES_DB: ${DB_NAME:-medialist_db}
      # Usuário da aplicação, só DML, criado pelo docker/postgres-init num volume novo.
      DB_USER: ${DB_USER:-media_app_user}
      DB_PASSWORD: ${DB_PASSWORD:-MediaList@2025!Secure}
    volumes:
      # A imagem 18 guarda os dados em /var/lib/postgresql/18/docker.
      - postgres_data:/var/lib/postgresql
      - "./docker/postgres-init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: aplica as migrações com o dono e sai. O backend só sobe depois.
  migrate:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-medialist_db}
      DB_OWNER_USER: ${DB_OWNER_USER:-medialist_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-medialist-owner-dev}
    depends_on:
      postgres:
        condition: service_healthy

  mongodb:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-senha123}
      # Usuário da aplicação, criado pelo script de init num volume novo.
      MONGO_DB_NAME: ${MONGO_DB_NAME:-medialist_updates_db}
      MONGO_APP_USER: ${MONGO_APP_USER:-medialist_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-medialist-app-dev}
    volumes:
      - mongodb_data:/data/db
      - "./docker/mongo-init:/docker-entrypoint-initdb.d:ro"

  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "127.0.0.1:${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-senha123}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-senha123}@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 5000
      APP_DEBUG: "false"
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-medialist_db}
      DB_USER: ${DB_USER:-media_app_user}
      DB_PASSWORD: ${DB_PASSWORD:-MediaList@2025!Secure}
      MONGO_URI: mongodb://${MONGO_APP_USER:-medialist_app}:${MONGO_APP_PASSWORD:-medialist-app-dev}@mongodb:27017/${MONGO_DB_NAME:-medialist_updates_db}?authSource=${MONGO_DB_NAME:-medialist_updates_db}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-medialist_updates_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-sua-chave-secreta-super-segura}
      JWT_ACCESS_TOKEN_DAYS: ${JWT_ACCESS_TOKEN_DAYS:-1}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-30}
      RAWG_API_KEY: ${RAWG_API_KEY:-}
      ANILIST_API_URL: ${ANILIST_API_URL:-https://graphql.anilist.co}
      RAWG_API_URL: ${RAWG_API_URL:-https://api.rawg.io/api}
    ports:
      # Todas as interfaces por padrão: o celular acessa o :5000 pela rede local.
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-5000}:5000"
    volumes:
      - "./Backend/importacao_logs:/app/importacao_logs"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mongodb:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5)\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/api}
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-3005}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  mongodb_data:
