# Lint do Backend. Só `ruff check`; o projeto não usa `ruff format`.
line-length = 120
target-version = "py312"

[lint]
select = ["E", "F", "I", "B"]

[lint.isort]
# Módulos do próprio Backend (rodam com Backend/ no sys.path).
known-first-party = ["app", "banco", "config", "contrato", "exportar_openapi", "database", "decorators", "dominio", "importacao", "parametros", "repositories", "routes", "schemas", "tests"]
