server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # "always" envia os headers também em respostas de erro. Os blocos location
    # abaixo não declaram add_header próprio, então herdam estes.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # CSP: tudo da própria origem (o bundle, as fontes do @fontsource, a API em /api). Sem
    # script inline: o tema inicial é public/tema-inicial.js. Imagens: as do catálogo vêm
    # dos CDNs do AniList (animes e mangás) e do RAWG (jogos); outra origem (URL de imagem de
    # Notícia, foto de perfil) é bloqueada. Os estilos inline do React entram pelo CSSOM,
    # que a CSP não barra.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://s4.anilist.co https://media.rawg.io https://shared.akamai.steamstatic.com https://shared.cloudflare.steamstatic.com https://steamcdn-a.akamaihd.net; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: rota profunda (/explorar, /midia/<id>) devolve o index.html e o roteador resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
