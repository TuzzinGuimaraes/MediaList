<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaList</title>
    <!-- Aplica o tema antes do primeiro paint, sem piscar o escuro no tema claro.
         Mesma regra de src/tema/tema.ts: escuro é o padrão. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('medialist.tema');
          var claro = p === 'claro' || (p === 'sistema' && matchMedia('(prefers-color-scheme: light)').matches);
          if (claro) document.documentElement.classList.add('claro');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-fundo text-texto antialiased">
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
