# Atualizações semanais. Minor e patch vêm agrupados num PR por ecossistema/diretório;
# majors vêm um PR por pacote, para cada quebra ser avaliada sozinha.
version: 2
updates:
  - package-ecosystem: pip
    directory: /Backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /Web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # @types/node acompanha o Node da imagem (LTS 24), que sobe à mão.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 espera o typescript-eslint suportar (peer < 7 em 2026-11).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /Mobile
    schedule:
      interval: weekly
    groups:
      mobile:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Expo, React, React Native e NativeWind/Tailwind seguem o SDK do Expo (ADR
    # 0005): sobem juntos com `npx expo install --fix`, não pacote a pacote.
    # react-dom acompanha o react fixado pelo SDK. Majors também ficam de fora.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-test-renderer"
      - dependency-name: "@types/react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "nativewind"
      - dependency-name: "tailwindcss"
      # Também fixados pelo SDK (`npx expo install --check`).
      - dependency-name: "@react-native-community/datetimepicker"
      - dependency-name: "babel-preset-expo"
      - dependency-name: "jest-expo"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directories:
      - /Backend
      - /Web
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Node só em versões LTS (pares) e trocadas à mão; Python sobe de versão à mão,
    # depois de conferir as wheels das dependências (psycopg).
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
