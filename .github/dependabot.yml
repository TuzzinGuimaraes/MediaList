# Atualizações semanais. Minor e patch vêm agrupados num PR por ecossistema/diretório;
# majors vêm um PR por pacote, para cada quebra ser avaliada sozinha.
version: 2
updates:
  - package-ecosystem: pip
    directory: /Backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /Frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Tailwind 4 troca o plugin do PostCSS; entra junto com a migração para Vite (ticket 19).
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /Mobile
    schedule:
      interval: weekly
    groups:
      mobile:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Expo, React, React Native e NativeWind/Tailwind seguem o SDK do Expo (ADR
    # 0005): sobem juntos com `npx expo install --fix`, não pacote a pacote.
    # react-dom acompanha o react fixado pelo SDK. Majors também ficam de fora.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-test-renderer"
      - dependency-name: "@types/react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "nativewind"
      - dependency-name: "tailwindcss"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directories:
      - /Backend
      - /Frontend
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Node só em versões LTS (pares) e trocadas à mão; Python sobe de versão à mão,
    # depois de conferir as wheels das dependências (psycopg, mysql-connector).
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
