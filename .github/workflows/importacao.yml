name: importacao

# Importação diária no runner (ADR-0013): não cabe nos 300 s de uma função da
# Vercel. Cada execução retoma, por Tipo de mídia, do cursor guardado no banco.
# Anime e mangá (AniList) têm duas passadas: o crescimento, por popularidade
# (`paginas`), e a atualização das populares, em rodízio pelas páginas 1–100
# (`paginas_atualizacao`).
# Os Tipos rodam em paralelo, um job cada. Uma falha deixa o workflow vermelho,
# e o GitHub avisa por email.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tipo:
        description: Tipo de mídia
        type: choice
        options: [todos, anime, manga, jogo]
        default: todos
      paginas:
        description: Páginas por Tipo de mídia, a partir do cursor (AniList, as do crescimento)
        type: number
        default: 20
      paginas_atualizacao:
        description: "AniList: páginas da atualização das populares (0 desliga)"
        type: number
        default: 10
      do_inicio:
        description: Ignorar o cursor e recomeçar do início
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  importacao:
    name: Importação (${{ matrix.tipo }})
    runs-on: ubuntu-latest
    # Medido com 120 ms de ida e volta ao banco (proxy com latência, importacao/medir.py):
    # 0,14 s por anime ou mangá e 0,27 s por jogo (o piso é o rate limit da RAWG). 60 páginas:
    # ~7 min (3000 animes ou mangás) e ~11 min (2400 jogos). Folga para a rede das fontes.
    # No AniList, as páginas da atualização somam às do crescimento.
    timeout-minutes: 45
    # Uma Importação de cada Tipo por vez; a nova espera a anterior em vez de
    # cancelá-la no meio de uma página.
    concurrency:
      group: importacao-producao-${{ matrix.tipo }}
      cancel-in-progress: false
    strategy:
      # Um Tipo que falha não interrompe os outros.
      fail-fast: false
      matrix:
        # No agendamento (inputs vazios) e com `todos`, os três; senão, o escolhido.
        tipo: ${{ fromJSON((!inputs.tipo || inputs.tipo == 'todos') && '["anime","manga","jogo"]' || format('["{0}"]', inputs.tipo)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install backend dependencies
        working-directory: Backend
        run: pip install -r requirements.txt

      # Os valores entram por env, não interpolados no script. Sem RAWG_API_KEY a
      # Importação de jogos é pulada com aviso.
      - name: run_import
        working-directory: Backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAWG_API_KEY: ${{ matrix.tipo == 'jogo' && secrets.RAWG_API_KEY || '' }}
          TIPO: ${{ matrix.tipo }}
          PAGINAS: ${{ inputs.paginas || 20 }}
          # Vazio no agendamento; 0 é valor (desliga), por isso o padrão vem no script.
          PAGINAS_ATUALIZACAO: ${{ inputs.paginas_atualizacao }}
          DO_INICIO: ${{ inputs.do_inicio || false }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL ausente"
            exit 1
          fi
          args=(--tipo "$TIPO" --paginas "$PAGINAS" --paginas-atualizacao "${PAGINAS_ATUALIZACAO:-10}")
          if [ "$DO_INICIO" = "true" ]; then args+=(--do-inicio); fi
          python -m importacao.run_import "${args[@]}"

      - name: Upload do log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: importacao-log-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.tipo }}
          path: Backend/importacao_logs/
          if-no-files-found: warn
          retention-days: 30

  # Sincronização diária da Steam (ADR-0015) de todos os Usuários conectados,
  # sem o orçamento do "Sincronizar agora", depois da Importação de jogos. Roda
  # mesmo se a Importação falhou; sem STEAM_API_KEY é pulada com aviso. Mesmo
  # log (e ocultação de segredos).
  steam:
    name: Sincronização da Steam
    needs: importacao
    if: ${{ !cancelled() && (!inputs.tipo || inputs.tipo == 'todos' || inputs.tipo == 'jogo') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: importacao-producao-steam
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install backend dependencies
        working-directory: Backend
        run: pip install -r requirements.txt

      - name: Sincronização da Steam
        working-directory: Backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python -m integracoes.job_steam

      - name: Upload do log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: importacao-log-${{ github.run_id }}-${{ github.run_attempt }}-steam
          path: Backend/importacao_logs/
          if-no-files-found: warn
          retention-days: 30
