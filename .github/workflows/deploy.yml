name: deploy

# Publica web + API num só projeto Vercel (ADR-0013): CI verde, migração com o
# dono, grants, e só então o deploy. Qualquer etapa que falhe para as seguintes,
# então o código novo nunca roda num schema velho. A integração Git da Vercel
# fica desligada (vercel.json), então só este workflow publica. Por último, o
# EAS Update do app (ADR-0014).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Um deploy por vez; um novo espera o anterior terminar em vez de cancelá-lo
# no meio de uma migração.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read

env:
  # CLI fixa: o build local (vercel build) foi verificado com esta versão.
  VERCEL_CLI_VERSION: 66.6.0
  VERCEL_PROJECT: medialist
  # Mesma versão do app-build: flags e saída do eas conferidos nela.
  EAS_CLI_VERSION: 27.11.0

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  migrar:
    name: Migração (alembic upgrade head)
    needs: ci
    # Secrets e produção só a partir da master ou de uma tag v* (um workflow_dispatch
    # noutra branch para aqui). O environment production repete a regra no GitHub.
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install backend dependencies
        working-directory: Backend
        run: pip install -r requirements.txt

      # O env.py do Alembic usa database_url(dono=True), que lê a DATABASE_OWNER_URL.
      - name: alembic upgrade head
        working-directory: Backend
        env:
          DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
        run: python -m alembic upgrade head

  grants:
    name: Grants
    needs: migrar
    # O environment production fica no job do db-grants (job que chama não aceita).
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/db-grants.yml
    secrets:
      DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

  vercel:
    name: Deploy na Vercel
    needs: grants
    # Secrets e produção só a partir da master ou de uma tag v* (um workflow_dispatch
    # noutra branch para aqui). O environment production repete a regra no GitHub.
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # O VERCEL_TOKEN vai só nos steps que chamam a CLI da Vercel, não no job:
    # o npm install e o pip install não o enxergam.
    env:
      # Opcional (variável do repositório): o time da Vercel, se a conta tiver mais de um.
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Web/package-lock.json

      # O serviço api (vercel.json) roda em Python 3.14 (Backend/.python-version);
      # o vercel build instala as dependências com o uv.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Vercel CLI e uv
        run: |
          npm install --global "vercel@${VERCEL_CLI_VERSION}"
          pip install uv==0.13.9

      # Cria o projeto na primeira vez e liga o checkout a ele. O token vai pela
      # variável VERCEL_TOKEN, que a CLI lê, e não na linha de comando.
      - name: vercel link
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          escopo=()
          if [ -n "$VERCEL_SCOPE" ]; then escopo=(--scope "$VERCEL_SCOPE"); fi
          if ! vercel project inspect "$VERCEL_PROJECT" "${escopo[@]}" > /dev/null; then
            vercel project create "$VERCEL_PROJECT" "${escopo[@]}"
          fi
          vercel link --yes --project "$VERCEL_PROJECT" "${escopo[@]}"

      # Variáveis de runtime da função, gravadas a cada deploy a partir dos
      # secrets (o valor vai pelo stdin, fora do log e da linha de comando).
      - name: Variáveis de ambiente da produção
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          gravar() {
            printf '%s' "$2" | vercel env add "$1" --environment production --force --yes "$3"
          }
          gravar APP_ENV production --no-sensitive
          gravar DB_POOL_MIN 0 --no-sensitive
          gravar DB_POOL_MAX 3 --no-sensitive
          gravar DATABASE_URL "$DATABASE_URL" --sensitive
          gravar JWT_SECRET_KEY "$JWT_SECRET_KEY" --sensitive

      - name: vercel pull
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production

      - name: vercel build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod

      - name: vercel deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod


  # EAS Update do app (ADR-0014) depois da API, para o JS novo nunca chamar uma
  # rota que ainda não existe. Só chega aos APKs com o mesmo runtimeVersion.
  app-update:
    name: EAS Update (canal production)
    needs: vercel
    # Secrets e produção só a partir da master ou de uma tag v* (um workflow_dispatch
    # noutra branch para aqui). O environment production repete a regra no GitHub.
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: Mobile

    # O EXPO_TOKEN vai só no step do eas update. O eas-cli vem do npm em versão
    # fixa, sem action de terceiro.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Até o ticket 03 (secret e eas init) o job passa com aviso, sem falhar o deploy.
      - name: Conferir EAS
        id: eas
        env:
          TEM_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
        run: |
          motivo=""
          if [ "$TEM_TOKEN" != "true" ]; then
            motivo="secret EXPO_TOKEN ausente"
          elif [ -z "$(jq -r '.expo.extra.eas.projectId // empty' app.json)" ] \
            || [ -z "$(jq -r '.expo.updates.url // empty' app.json)" ]; then
            motivo="app.json sem extra.eas.projectId ou updates.url"
          fi
          if [ -n "$motivo" ]; then
            echo "::warning::EAS Update pulado: ${motivo} (ticket 03 da app-producao)."
            echo "pular=true" >> "$GITHUB_OUTPUT"
          else
            echo "pular=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.eas.outputs.pular != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Mobile/package-lock.json

      - name: Install mobile dependencies
        if: steps.eas.outputs.pular != 'true'
        run: npm ci

      - name: Setup EAS CLI
        if: steps.eas.outputs.pular != 'true'
        run: npm install -g "eas-cli@${EAS_CLI_VERSION}"

      # O EXPO_PUBLIC_API_URL do env entra no bundle (o eas-cli repassa o env do
      # processo ao expo export); uma variável de mesmo nome no ambiente
      # production do EAS venceria. O assunto do commit vem do git, nunca de
      # uma expressão interpolada no script.
      - name: eas update
        if: steps.eas.outputs.pular != 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: https://medialist-five.vercel.app/api
        run: |
          mensagem="${GITHUB_SHA::7} $(git log -1 --format=%s)"
          eas update --channel production --environment production --platform android --non-interactive --message "$mensagem"
