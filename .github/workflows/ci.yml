name: CI

# push só na master; branches de trabalho rodam pelo pull_request. Assim um push
# num PR aberto dispara uma execução, não duas. O workflow deploy chama este
# (workflow_call) antes de migrar e publicar.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

# Um push novo no mesmo PR (ou na mesma branch) cancela a execução anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint dos próprios workflows (com shellcheck nos `run:`, já instalado no runner).
  # Binário fixo, conferido pelo sha256 antes de rodar (como o age no backup).
  actionlint:
    name: Lint dos workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      ACTIONLINT_VERSION: 1.7.12
      # sha256 do actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz (digest do release no GitHub).
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: actionlint
        run: |
          arquivo="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${arquivo}"
          echo "${ACTIONLINT_SHA256}  ${arquivo}" | sha256sum --check --strict
          tar -xzf "$arquivo" actionlint
          ./actionlint -color

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            Backend/requirements.txt
            Backend/requirements-dev.txt

      # pytest e ruff ficam fora da imagem de produção e rodam no runner. O
      # contrato SQL, o módulo banco e os repositórios rodam contra o
      # PostgreSQL do compose, já migrado.
      - name: Install backend dependencies
        working-directory: Backend
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: Backend
        run: ruff check --output-format=github .

      # Contrato da API (ADR 0011): contrato/openapi.json e contrato/api.d.ts
      # têm de bater com o Backend. Se falhar, rode `make api-tipos` e commite.
      - name: Setup Node.js (openapi-typescript)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Contrato da API em dia
        run: |
          make api-tipos
          git diff --exit-code contrato/

      - name: Validate Docker Compose
        run: docker compose config > /dev/null

      - name: Build backend image
        run: docker compose build backend migrate

      # --wait espera o postgres healthy, o migrate (alembic upgrade head)
      # terminar com sucesso e o healthcheck do backend.
      - name: Start postgres, migrate and backend
        run: docker compose up -d --wait --wait-timeout 180 postgres migrate backend

      - name: Migration logs
        if: ${{ !cancelled() }}
        run: docker compose logs migrate

      # Usuário da aplicação (só DML), com os defaults do compose. O dono só
      # entra no teste de migração, que cria e apaga um banco descartável.
      - name: Run backend pytest suite
        working-directory: Backend
        env:
          TEST_DATABASE_URL: postgresql://media_app_user:MediaList%402025%21Secure@127.0.0.1:5433/medialist_db
          TEST_OWNER_DATABASE_URL: postgresql://medialist_owner:medialist-owner-dev@127.0.0.1:5433/medialist_db
        run: pytest -q --cov --cov-report=term

      # Cobertura é só relatório: não há limite mínimo que bloqueie o merge.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        working-directory: Backend
        run: |
          {
            echo "### Cobertura do Backend"
            echo
            python -m coverage report --format=markdown || echo "Resumo de cobertura indisponível."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run backend smoke scripts
        run: |
          docker compose exec -T backend python smoke_postgres.py
          docker compose exec -T backend python smoke_permissions.py

      - name: Shutdown stack
        if: always()
        run: docker compose down -v

  web:
    name: Web Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: Install web dependencies
        working-directory: Web
        run: npm ci

      - name: Typecheck
        working-directory: Web
        run: npx tsc -b

      - name: Lint (eslint)
        working-directory: Web
        run: npx eslint --max-warnings=0 .

      - name: Run web test suite
        working-directory: Web
        run: npx vitest run

      # A imagem (Web/Dockerfile) roda `npm run build` no estágio de build; não repetimos no runner.
      - name: Build web image
        run: docker compose build frontend

  # Fluxos E2E (Playwright, Web/e2e/fluxos) contra o stack inteiro do compose, que nasce
  # vazio e recebe o seed-dev. Na falha, o relatório e os traces sobem como artefato.
  e2e:
    name: E2E do web (fluxos)
    runs-on: ubuntu-latest
    # Acima do globalTimeout do playwright.config.ts (10 min), para o relatório sair.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: Install web dependencies
        working-directory: Web
        run: npm ci

      # --wait: postgres healthy, migrate concluído, backend e frontend healthy.
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Seed de desenvolvimento
        run: make seed-dev

      # Só o Chromium (com as libs do sistema), na versão fixa do package-lock.
      - name: Install Chromium
        working-directory: Web
        run: npx playwright install --with-deps chromium

      - name: Run E2E (fluxos)
        working-directory: Web
        env:
          E2E_BASE_URL: http://localhost:3005
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-fluxos
          path: |
            Web/playwright-report/
            Web/test-results/
          retention-days: 14

      - name: Stack logs
        if: ${{ failure() }}
        run: docker compose logs backend frontend

      - name: Shutdown stack
        if: always()
        run: docker compose down -v

  mobile:
    name: Mobile Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # RNTL 14 exige Node ^22.13 || >=24.
          node-version: 24
          cache: npm
          cache-dependency-path: Mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: Mobile
        run: npm ci

      - name: Typecheck
        working-directory: Mobile
        run: npm run typecheck

      - name: Lint
        working-directory: Mobile
        run: npm run lint

      # Inclui os testes de dominio/ (roots do jest no package.json).
      - name: Run mobile test suite
        working-directory: Mobile
        run: npm test -- --ci --coverage --coverageReporters=json-summary --coverageReporters=text-summary

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node .github/scripts/jest-coverage-summary.js Mobile/coverage/coverage-summary.json "Cobertura do Mobile" >> "$GITHUB_STEP_SUMMARY"
